<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finance Tracker</title>
<meta name="description" content="Personal finance and net worth tracker">

<!-- PWA -->
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FinTracker">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Libraries -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0f14;
  --surface: #13161e;
  --surface-dim: #1a1e29;
  --border: rgba(255,255,255,0.07);
  --border-focus: #6c8aff;
  --text: #e8eaf0;
  --text-2: #8b90a0;
  --text-3: #555a6e;
  --accent: #6c8aff;
  --accent-hover: #4d6fff;
  --accent-bg: rgba(108,138,255,0.1);
  --positive: #3ecf8e;
  --positive-bg: rgba(62,207,142,0.1);
  --negative: #f66;
  --negative-bg: rgba(255,102,102,0.1);
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 2px; }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Header */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  padding-top: env(safe-area-inset-top);
  height: calc(56px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-logo { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
.header-logo span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-2);
  font-size: 14px;
  transition: all 0.15s;
}
.icon-btn:hover, .icon-btn:active { background: var(--surface-dim); color: var(--text); border-color: #D1D5DB; }
.icon-btn svg { width: 16px; height: 16px; }

/* Tab Bar */
.tab-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  position: sticky;
  bottom: 0;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 0 8px;
  cursor: pointer;
  color: var(--text-3);
  transition: color 0.15s;
  border: none;
  background: none;
  font-family: 'Inter', sans-serif;
  position: relative;
}
.tab-item.active { color: var(--accent); }
.tab-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 2px;
  background: var(--accent);
  border-radius: 0 0 2px 2px;
}
.tab-item svg { width: 18px; height: 18px; }
.tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }

/* Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 80px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 12px;
}

/* Net Worth Card */
.nw-card {
  background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 50%, #C7D2FE 100%);
  border: 1px solid rgba(99,102,241,0.15);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: var(--shadow);
}
.nw-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
}
.nw-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}
.nw-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.nw-change { display: flex; align-items: center; gap: 4px; font-weight: 600; font-size: 13px; }
.nw-change.pos { color: var(--positive); }
.nw-change.neg { color: var(--negative); }

.month-select {
  background: rgba(255,255,255,0.7);
  border: 1px solid rgba(99,102,241,0.2);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
  outline: none;
}

/* Metrics Grid */
.metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  box-shadow: var(--shadow);
}
.metric-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 6px; }
.metric-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; }
.metric-value.green { color: var(--positive); }
.metric-value.red { color: var(--negative); }

/* Progress */
.progress-row { margin-bottom: 14px; }
.progress-row:last-child { margin-bottom: 0; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.progress-name { font-size: 13px; font-weight: 600; color: var(--text); }
.progress-vals { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-2); }
.progress-track { height: 6px; background: #E5E7EB; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

/* FIRE Grid */
.fire-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fire-stat {
  background: var(--surface-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
}
.fire-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); margin-bottom: 4px; font-weight: 600; }
.fire-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; color: var(--accent); }

/* Forms */
.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  margin-bottom: 6px;
}
input, select, textarea {
  width: 100%;
  background: var(--surface-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(67,97,238,0.1);
}
select option { background: var(--surface); }
input[type=number] { font-family: 'JetBrains Mono', monospace; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: var(--radius-xs);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-dim); color: var(--text); }
.btn-success { background: var(--positive-bg); color: var(--positive); border: 1px solid rgba(5,150,105,0.2); }
.btn-success:hover { background: #D1FAE5; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { padding: 6px 10px; font-size: 12px; }

/* Entry Rows */
.entry-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.entry-row:last-child { border-bottom: none; }
.entry-info { flex: 1; min-width: 0; }
.entry-account { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.entry-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.entry-amount { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; }
.entry-actions { display: flex; gap: 4px; }
.entry-edit-input { font-family: 'JetBrains Mono', monospace; font-size: 14px; width: 120px; }

/* Copy Table */
.copy-table { width: 100%; border-collapse: collapse; }
.copy-table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
}
.copy-table td { padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.copy-table input { padding: 6px 8px; font-size: 13px; width: 100%; }

/* Account Groups */
.account-group { margin-bottom: 16px; }
.account-group-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  padding: 8px 0 6px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.account-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface-dim);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
}
.account-item-info { flex: 1; min-width: 0; }
.account-item-name { font-size: 14px; font-weight: 600; }
.account-actions { display: flex; gap: 4px; }
.type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
.type-badge.asset { background: var(--positive-bg); color: var(--positive); }
.type-badge.debt { background: var(--negative-bg); color: var(--negative); }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px 20px 16px 16px;
  width: 100%;
  max-width: 480px;
  padding: 24px 20px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }

/* Toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  z-index: 300;
  box-shadow: var(--shadow-md);
  white-space: nowrap;
}
.toast.success { border-color: rgba(5,150,105,0.3); color: var(--positive); }
.toast.error { border-color: rgba(220,38,38,0.3); color: var(--negative); }

/* Charts */
.pie-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.pie-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.pie-legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* Skeleton */
.skeleton {
  background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
  height: 40px;
  margin-bottom: 10px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Sync Indicator */
.sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.sync-dot.ok { background: var(--positive); }
.sync-dot.err { background: var(--negative); }

/* Empty State */
.empty { text-align: center; padding: 32px 16px; color: var(--text-3); font-size: 14px; }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── UTILS ────────────────────────────────────────────────
function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) return (n / 1_000_000).toFixed(2) + 'M';
  if (abs >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtFull(n) {
  if (n === undefined || isNaN(n)) return '—';
  return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getConfig() {
  try { return JSON.parse(localStorage.getItem('ftConfig') || '{}'); } catch { return {}; }
}

function saveConfig(c) { localStorage.setItem('ftConfig', JSON.stringify(c)); }

// ─── API (fetch with JSONP fallback) ──────────────────────
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = '_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('Request timed out')); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; if (script.parentNode) script.parentNode.removeChild(script); }
    window[cb] = (data) => { cleanup(); if (data && data.error) reject(new Error(data.error)); else resolve(data); };
    script.src = url + '&callback=' + cb;
    script.onerror = () => { cleanup(); reject(new Error('Request failed')); };
    document.head.appendChild(script);
  });
}

async function api(path, action, params = {}, body = null) {
  const cfg = getConfig();
  if (!cfg.url) throw new Error('No API URL set. Go to Settings and paste your Apps Script URL.');
  if (!cfg.apiKey) throw new Error('No API key set. Go to Settings and enter your API key.');

  const url = new URL(cfg.url.trim());
  url.searchParams.set('path', path);
  url.searchParams.set('api_key', (cfg.apiKey || '').trim());
  if (action) url.searchParams.set('action', action);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  if (body) url.searchParams.set('body', JSON.stringify(body));
  const urlStr = url.toString();

  try {
    const res = await fetch(urlStr, { redirect: 'follow' });
    const data = await res.json();
    if (data && data.error) throw new Error(data.error);
    return data;
  } catch (fetchErr) {
    try {
      return await jsonp(urlStr);
    } catch (_) {
      throw fetchErr;
    }
  }
}

// ─── TOAST ────────────────────────────────────────────────
function useToast() {
  const [toast, setToast] = useState(null);
  const show = useCallback((msg, type = 'success') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2800);
  }, []);
  return { toast, show };
}

const Icons = {

  edit: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

};

// ─── CONSTANTS ────────────────────────────────────────────
const CATEGORY_COLORS = {
  'Cash': '#6c8aff',
  'Investment': '#f5a623',
  'Emergency Fund': '#3ecf8e',
  'Other Assets': '#2dd4bf',
  'Credit Card': '#f66',
  'Personal Loan': '#ff9f7f',
  'Other Debt': '#a78bfa',
};
const CATEGORIES = ['Cash','Emergency Fund','Investment','Other Assets','Credit Card','Personal Loan','Other Debt'];
const TYPES = ['Asset','Debt'];
const CURRENCIES = ['PHP','USD','EUR','SGD','JPY','GBP','AUD','HKD','CNY','KRW'];

// ─── PIE CHART ────────────────────────────────────────────
function PieChart({ data, colors }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data || data.length === 0) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }

    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new window.Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: data.map(d => d.category),
        datasets: [{
          data: data.map(d => d.amount),
          backgroundColor: colors,
          borderColor: '#FFFFFF',
          borderWidth: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '62%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: c => {
                const total = c.dataset.data.reduce((a, b) => a + b, 0);
                const pct = total > 0 ? ((c.parsed / total) * 100).toFixed(1) : '0.0';
                return ' ' + c.label + ': ' + pct + '%';
              }
            },
            titleColor: '#fff', bodyColor: '#E8EAF0',
            backgroundColor: 'rgba(17,24,39,0.9)',
            padding: 10, cornerRadius: 8,
          }
        },
      },
      plugins: [{
        id: 'pctLabels',
        afterDatasetDraw(chart) {
          const { ctx: c, data: d } = chart;
          const total = d.datasets[0].data.reduce((a, b) => a + b, 0);
          if (!total) return;
          chart.getDatasetMeta(0).data.forEach((arc, i) => {
            const pct = (d.datasets[0].data[i] / total * 100).toFixed(1);
            if (parseFloat(pct) < 5) return;
            const { x, y } = arc.tooltipPosition();
            c.save();
            c.font = '600 11px Inter, sans-serif';
            c.fillStyle = '#fff';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText(pct + '%', x, y);
            c.restore();
          });
        }
      }]
    });

    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(data)]);

  return (
    <div style={{ position: 'relative', height: 200, width: '100%' }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

// ─── BAR CHART ────────────────────────────────────────────
function BarChart({ data }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || !data || data.length === 0) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }

    const ctx = canvasRef.current.getContext('2d');
    chartRef.current = new window.Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.map(d => d.month),
        datasets: [{
          label: 'Net Worth',
          data: data.map(d => d.nw),
          backgroundColor: '#4361EE',
          borderRadius: 4,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: { label: c => ' ' + fmt(c.parsed.y) },
            titleColor: '#fff', bodyColor: '#E8EAF0',
            backgroundColor: 'rgba(17,24,39,0.9)',
            padding: 10, cornerRadius: 8,
          }
        },
        scales: {
          y: {
            beginAtZero: false,
            ticks: { callback: v => fmt(v), color: '#9CA3AF', font: { size: 10, family: 'Inter' }, maxTicksLimit: 5 },
            grid: { color: 'rgba(0,0,0,0.04)' },
            border: { display: false }
          },
          x: {
            ticks: { color: '#9CA3AF', font: { size: 10, family: 'Inter' }, maxTicksLimit: 12, maxRotation: 0 },
            grid: { display: false },
            border: { display: false }
          }
        }
      }
    });

    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, [JSON.stringify(data)]);

  return (
    <div style={{ position: 'relative', height: 200, width: '100%' }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

// ─── PROGRESS BAR ─────────────────────────────────────────
function ProgressBar({ name, current, target, color = '#4361EE' }) {
  const pct = target > 0 ? Math.min(100, (current / target) * 100) : 0;
  return (
    <div className="progress-row">
      <div className="progress-header">
        <span className="progress-name">{name}</span>
        <span className="progress-vals">{fmt(current)} / {fmt(target)}</span>
      </div>
      <div className="progress-track">
        <div className="progress-fill" style={{ width: pct + '%', background: color }} />
      </div>
    </div>
  );
}

  }, [data]);

  if (loading) return (
    <div className="content">
      {[1,2,3,4,5].map(i => <div key={i} className="skeleton" />)}

  if (!data) return (
    <div className="content">
      <div className="empty">Configure your API in Settings to get started.</div>

  const months = data.netWorthHistory || [];
  const monthOpts = months.map(m => m.month).reverse();

  const currentData = viewMonth
    ? months.find(m => m.month === viewMonth) || months[months.length - 1]
    : months[months.length - 1];

  const prevIdx = months.findIndex(m => m.month === currentData?.month) - 1;
  const prevData = prevIdx >= 0 ? months[prevIdx] : null;
  const change = prevData ? currentData.netWorth - prevData.netWorth : 0;

    <div className="content">
      {/* Net Worth */}

        <div className="nw-label">Net Worth</div>
        <div className="nw-amount">{currency} {fmtFull(currentData?.netWorth)}</div>
        <div className="nw-meta">

            <span className={'nw-change ' + (change >= 0 ? 'pos' : 'neg')}>
              {change >= 0 ? '▲' : '▼'} {fmt(Math.abs(change))}

        <div className="metric-card">
          <div className="metric-label">Total Debt</div>

      </div>

      {/* Asset Allocation */}
      <div className="card">
        <div className="section-title">Asset Allocation</div>
        {assetAllocation.length > 0 ? (
          <>
            <PieChart data={assetAllocation} colors={allocationColors} />
            <div className="pie-legend">
              {assetAllocation.map((e, i) => (
                <div key={i} className="pie-legend-item">

      </div>

      {/* Investment Milestones */}

// ─── INPUT TAB ────────────────────────────────────────────
function InputTab({ accounts, currency, onToast }) {
  const now = new Date();
  const defaultMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const [month, setMonth] = useState(defaultMonth);
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editAmount, setEditAmount] = useState('');
  const [showCopyModal, setShowCopyModal] = useState(false);
  const [copyRows, setCopyRows] = useState([]);
  const [copyLoading, setCopyLoading] = useState(false);
  const [singleAccount, setSingleAccount] = useState('');
  const [singleAmount, setSingleAmount] = useState('');

  const loadEntries = useCallback(async () => {
    if (!month) return;
    setLoading(true);
    try {
      const d = await api('entries', null, { month });
      setEntries(d.entries || []);
    } catch (e) { onToast(e.message, 'error'); }
    finally { setLoading(false); }
  }, [month, onToast]);

  useEffect(() => { loadEntries(); }, [loadEntries]);

  async function handleSingleSubmit(e) {
    e.preventDefault();
    if (!singleAccount || !singleAmount) return;
    setSubmitting(true);
    try {
      await api('entries', 'create', {}, { month, account: singleAccount, amount: parseFloat(singleAmount) });
      onToast('Entry added');
      setSingleAmount('');
      await loadEntries();
    } catch (err) { onToast(err.message, 'error'); }
    finally { setSubmitting(false); }
  }

  async function handleEdit(id) {
    setSubmitting(true);
    try {
      const entry = entries.find(e => e.id === id);
      await api('entries', 'update', {}, { id, month: entry.month, account: entry.account, amount: parseFloat(editAmount) });
      onToast('Entry updated');
      setEditId(null);
      await loadEntries();
    } catch (err) { onToast(err.message, 'error'); }
    finally { setSubmitting(false); }
  }

  async function handleDelete(id) {
    if (!confirm('Delete this entry?')) return;
    try {
      await api('entries', 'delete', {}, { id });
      onToast('Entry deleted');
      await loadEntries();
    } catch (err) { onToast(err.message, 'error'); }
  }

  async function loadCopyPrevious() {
    setCopyLoading(true);
    try {
      const d = await api('entries', 'copy_previous', { month });
      setCopyRows(d.entries.map(e => ({ ...e, checked: true })));
      setShowCopyModal(true);
    } catch (err) { onToast(err.message, 'error'); }
    finally { setCopyLoading(false); }
  }

  async function submitCopyRows() {
    const toSubmit = copyRows.filter(r => r.checked);
    if (!toSubmit.length) { onToast('No entries selected', 'error'); return; }
    setCopyLoading(true);
    try {
      for (const row of toSubmit) {
        await api('entries', 'create', {}, { month, account: row.account, amount: parseFloat(row.amount) || 0 });
      }
      onToast(toSubmit.length + ' entries added');
      setShowCopyModal(false);
      await loadEntries();
    } catch (err) { onToast(err.message, 'error'); }
    finally { setCopyLoading(false); }
  }

  function changeMonth(dir) {
    const [y, m] = month.split('-').map(Number);
    let ny = y, nm = m + dir;
    if (nm > 12) { ny++; nm = 1; }
    if (nm < 1) { ny--; nm = 12; }
    setMonth(ny + '-' + String(nm).padStart(2, '0'));
  }

  return (
    <div className="content">
      {/* Month selector */}
      <div className="card" style={{ padding: '12px 18px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <button className="btn btn-ghost btn-sm" onClick={() => changeMonth(-1)}>{'‹'}</button>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 16, fontWeight: 700 }}>{month}</div>
            <div style={{ fontSize: 11, color: 'var(--text-3)' }}>{entries.length} entries</div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={() => changeMonth(1)}>{'›'}</button>
        </div>
      </div>

      {/* Copy Previous Month */}
      <button className="btn btn-success btn-full" onClick={loadCopyPrevious} disabled={copyLoading} style={{ gap: 8, fontSize: 13 }}>
        <span style={{ display: 'inline-flex', width: 16, height: 16 }}>{Icons.copy}</span>
        {copyLoading ? 'Loading...' : 'Copy from Previous Month'}
      </button>

      {/* Add Single Entry */}
      <div className="card">
        <div className="section-title">Add Entry</div>
        <form onSubmit={handleSingleSubmit}>
          <div className="form-group">
            <label>Account</label>
            <select value={singleAccount} onChange={e => setSingleAccount(e.target.value)} required>
              <option value="">Select account...</option>
              {CATEGORIES.map(cat => {
                const catAccounts = accounts.filter(a => a.category === cat);
                if (!catAccounts.length) return null;
                return (
                  <optgroup key={cat} label={cat}>
                    {catAccounts.map(a => (
                      <option key={a.id} value={a.account}>{a.account} ({a.currency})</option>
                    ))}
                  </optgroup>
                );
              })}
            </select>
          </div>
          <div className="form-group">
            <label>Amount ({accounts.find(a => a.account === singleAccount)?.currency || currency})</label>
            <input type="number" step="0.01" placeholder="0.00" value={singleAmount} onChange={e => setSingleAmount(e.target.value)} required />
          </div>
          <button type="submit" className="btn btn-primary btn-full" disabled={submitting} style={{ gap: 8, fontSize: 13 }}>
            <span style={{ display: 'inline-flex', width: 16, height: 16 }}>{Icons.plus}</span>
            {submitting ? 'Saving...' : 'Add Entry'}
          </button>
        </form>
      </div>

      {/* Entries for selected month */}
      <div className="card">
        <div className="section-title">Entries for {month}</div>
        {loading ? [1,2,3].map(i => <div key={i} className="skeleton" />) : entries.length === 0 ? (
          <div className="empty" style={{ padding: '20px 0' }}>No entries yet for this month.</div>
        ) : (
          <div>
            {entries.map(entry => (
              <div key={entry.id} className="entry-row">
                <div className="entry-info">
                  <div className="entry-account">{entry.account}</div>
                  <div className="entry-meta">{entry.category} {'·'} {entry.currency}</div>
                </div>
                {editId === entry.id ? (
                  <>
                    <input className="entry-edit-input" type="number" step="0.01" value={editAmount} onChange={e => setEditAmount(e.target.value)} autoFocus />
                    <div className="entry-actions">
                      <button className="btn btn-sm btn-primary" onClick={() => handleEdit(entry.id)} disabled={submitting}>{'✓'}</button>
                      <button className="btn btn-sm btn-ghost" onClick={() => setEditId(null)}>{'✕'}</button>
                    </div>
                  </>
                ) : (
                  <>
                    <div style={{ textAlign: 'right' }}>
                      <div className="entry-amount" style={{ color: entry.type === 'Debt' ? 'var(--negative)' : 'var(--positive)' }}>
                        {entry.currency !== currency ? entry.currency + ' ' : ''}{entry.type === 'Debt' ? '-' : ''}{fmtFull(entry.amount)}
                      </div>
                      {entry.currency !== currency && entry.amountLocal !== 0 && (
                        <div style={{ fontSize: 10, color: 'var(--text-3)', fontFamily: "'JetBrains Mono'" }}>
                          {'≈'} {currency} {fmtFull(Math.abs(entry.amountLocal))}
                        </div>
                      )}
                    </div>
                    <div className="entry-actions">
                      <button className="icon-btn" style={{ width: 30, height: 30 }} onClick={() => { setEditId(entry.id); setEditAmount(entry.amount); }}>{Icons.edit}</button>
                      <button className="icon-btn" style={{ width: 30, height: 30, color: 'var(--negative)' }} onClick={() => handleDelete(entry.id)}>{Icons.trash}</button>
                    </div>
                  </>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Copy Previous Modal */}
      {showCopyModal && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowCopyModal(false)}>
          <div className="modal">
            <div className="modal-title">Copy to {month}</div>
            <div style={{ fontSize: 12, color: 'var(--text-3)', marginBottom: 12 }}>
              Amounts pre-filled from previous month. Adjust as needed, uncheck to skip.
            </div>
            <div style={{ overflowX: 'auto', maxHeight: '50vh', overflowY: 'auto' }}>
              <table className="copy-table">
                <thead>
                  <tr>
                    <th style={{ width: 24 }}></th>
                    <th>Account</th>
                    <th>Cat</th>
                    <th>Cur</th>
                    <th>Amount</th>
                  </tr>
                </thead>
                <tbody>
                  {copyRows.map((row, i) => (
                    <tr key={i} style={{ opacity: row.checked ? 1 : 0.4 }}>
                      <td><input type="checkbox" checked={row.checked} style={{ width: 'auto' }} onChange={e => setCopyRows(rows => rows.map((r, j) => j === i ? { ...r, checked: e.target.checked } : r))} /></td>
                      <td><div style={{ fontSize: 12, fontWeight: 600 }}>{row.account}</div></td>
                      <td style={{ fontSize: 11, color: 'var(--text-3)' }}>{(row.category || '').split(' ').map(w => w[0]).join('')}</td>
                      <td style={{ fontSize: 11, color: 'var(--text-3)', fontFamily: "'JetBrains Mono'" }}>{row.currency}</td>
                      <td><input type="number" step="0.01" value={row.amount} style={{ width: '100%' }} onChange={e => setCopyRows(rows => rows.map((r, j) => j === i ? { ...r, amount: e.target.value } : r))} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="modal-actions">
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={submitCopyRows} disabled={copyLoading}>
                {copyLoading ? 'Saving...' : 'Submit ' + copyRows.filter(r => r.checked).length + ' entries'}
              </button>
              <button className="btn btn-ghost" onClick={() => setShowCopyModal(false)}>{'✕'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SETTINGS TAB ─────────────────────────────────────────
function SettingsTab({ accounts, setAccounts, localCurrency, setLocalCurrency, onToast, installPrompt }) {
  const [cfg, setCfg] = useState(getConfig());
  const [showModal, setShowModal] = useState(false);
  const [editAccount, setEditAccount] = useState(null);
  const [savingCfg, setSavingCfg] = useState(false);
  const [form, setForm] = useState({ account: '', type: 'Asset', category: 'Cash', currency: 'PHP' });
  const [savingAcc, setSavingAcc] = useState(false);

  function updateCfgField(key, val) { setCfg(c => { const n = { ...c, [key]: val }; saveConfig(n); return n; }); }

  async function handleSaveCurrency() {
    setSavingCfg(true);
    try {
      await api('accounts', 'set_currency', {}, { currency: localCurrency });
      onToast('Currency updated');
    } catch (e) { onToast(e.message, 'error'); }
    finally { setSavingCfg(false); }
  }

  function openAdd() { setForm({ account: '', type: 'Asset', category: 'Cash', currency: localCurrency || 'PHP' }); setEditAccount(null); setShowModal(true); }
  function openEdit(acc) { setForm({ account: acc.account, type: acc.type, category: acc.category, currency: acc.currency }); setEditAccount(acc); setShowModal(true); }

  async function handleSaveAccount() {
    setSavingAcc(true);
    try {
      if (editAccount) {
        await api('accounts', 'update', {}, { id: editAccount.id, ...form });
        setAccounts(prev => prev.map(a => a.id === editAccount.id ? { ...a, ...form } : a));
        onToast('Account updated');
      } else {
        const d = await api('accounts', 'create', {}, form);
        setAccounts(prev => [...prev, { id: d.id, ...form }]);
        onToast('Account added');
      }
      setShowModal(false);
    } catch (e) { onToast(e.message, 'error'); }
    finally { setSavingAcc(false); }
  }

  async function handleDeleteAccount(acc) {
    if (!confirm('Delete "' + acc.account + '"?')) return;
    try {
      await api('accounts', 'delete', {}, { id: acc.id });
      setAccounts(prev => prev.filter(a => a.id !== acc.id));
      onToast('Account deleted');
    } catch (e) { onToast(e.message, 'error'); }
  }

  const grouped = CATEGORIES.reduce((acc, cat) => {
    acc[cat] = accounts.filter(a => a.category === cat);
    return acc;
  }, {});

  return (
    <div className="content">
      {/* Install App */}
      {installPrompt && (
        <div className="card" style={{ background: 'var(--accent-bg)', borderColor: 'rgba(108,138,255,0.2)' }}>
          <button className="btn btn-primary btn-full" onClick={async () => {
            try { await installPrompt.prompt(); } catch(e) {}
          }} style={{ gap: 8, fontSize: 13 }}>
            <span style={{ display: 'inline-flex', width: 16, height: 16 }}>{Icons.download}</span>
            Install App
          </button>
          <div style={{ fontSize: 11, color: 'var(--text-2)', textAlign: 'center', marginTop: 8 }}>
            Add to your home screen for quick access
          </div>
        </div>
      )}

      {/* Connection Settings */}
      <div className="card">
        <div className="section-title">Connection</div>
        <div className="form-group">
          <label>Apps Script URL</label>
          <input type="url" value={cfg.url || ''} onChange={e => updateCfgField('url', e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" />
        </div>
        <div className="form-group">
          <label>API Key</label>
          <input type="password" value={cfg.apiKey || ''} onChange={e => updateCfgField('apiKey', e.target.value)} placeholder="Your secret key" />
        </div>
        <TestConnectionButton onToast={onToast} />
      </div>

      {/* Currency */}
      <div className="card">
        <div className="section-title">Currency</div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
          <div className="form-group" style={{ flex: 1, marginBottom: 0 }}>
            <label>Local / Base Currency</label>
            <select value={localCurrency} onChange={e => setLocalCurrency(e.target.value)}>
              {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <button className="btn btn-primary" onClick={handleSaveCurrency} disabled={savingCfg} style={{ height: 42, marginBottom: 0 }}>
            Save
          </button>
        </div>
      </div>

      {/* Accounts */}
      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div className="section-title" style={{ marginBottom: 0 }}>Accounts</div>
          <button className="btn btn-primary btn-sm" onClick={openAdd}>{Icons.plus} Add</button>
        </div>
        {CATEGORIES.map(cat => {
          const catAccounts = grouped[cat] || [];
          if (!catAccounts.length) return null;
          return (
            <div key={cat} className="account-group">
              <div className="account-group-title">{cat} ({catAccounts.length})</div>
              {catAccounts.map(acc => (
                <div key={acc.id} className="account-item">
                  <div className="account-item-info">
                    <div className="account-item-name">{acc.account}</div>
                    <div style={{ display: 'flex', gap: 5, marginTop: 4, alignItems: 'center' }}>
                      <span className={'type-badge ' + (acc.type === 'Asset' ? 'asset' : 'debt')}>{acc.type}</span>
                      <span style={{ fontSize: 10, padding: '2px 6px', borderRadius: 4, background: '#F3F4F6', color: 'var(--text-2)', fontFamily: "'JetBrains Mono'" }}>{acc.currency}</span>
                    </div>
                  </div>
                  <div className="account-actions">
                    <button className="icon-btn" style={{ width: 30, height: 30 }} onClick={() => openEdit(acc)}>{Icons.edit}</button>
                    <button className="icon-btn" style={{ width: 30, height: 30, color: 'var(--negative)' }} onClick={() => handleDeleteAccount(acc)}>{Icons.trash}</button>
                  </div>
                </div>
              ))}
            </div>
          );
        })}
        {accounts.length === 0 && <div className="empty">No accounts yet. Click Add to create one.</div>}
      </div>

      {/* Account Modal */}
      {showModal && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowModal(false)}>
          <div className="modal">
            <div className="modal-title">{editAccount ? 'Edit Account' : 'Add Account'}</div>
            <div className="form-group">
              <label>Account Name</label>
              <input value={form.account} onChange={e => setForm(f => ({ ...f, account: e.target.value }))} placeholder="e.g. BDO Savings" />
            </div>
            <div className="form-group">
              <label>Type</label>
              <select value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
                {TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Category</label>
              <select value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))}>
                {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label>Currency</label>
              <select value={form.currency} onChange={e => setForm(f => ({ ...f, currency: e.target.value }))}>
                {CURRENCIES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="modal-actions">
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={handleSaveAccount} disabled={savingAcc}>
                {savingAcc ? 'Saving...' : 'Save'}
              </button>
              <button className="btn btn-ghost" onClick={() => setShowModal(false)}>{'✕'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState('dashboard');
  const [dashData, setDashData] = useState(null);
  const [dashLoading, setDashLoading] = useState(false);
  const [accounts, setAccounts] = useState([]);
  const [localCurrency, setLocalCurrency] = useState('PHP');
  const [syncStatus, setSyncStatus] = useState('idle');
  const [installPrompt, setInstallPrompt] = useState(null);
  const { toast, show: showToast } = useToast();

  useEffect(() => {
    const handler = e => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  async function loadAll() {
    const cfg = getConfig();
    if (!cfg.url) return;
    setSyncStatus('loading');
    setDashLoading(true);
    try {
      const [dash, accs] = await Promise.all([
        api('dashboard'),
        api('accounts')
      ]);
      setDashData(dash);
      setAccounts(accs.accounts || []);
      setLocalCurrency(accs.localCurrency || 'PHP');
      setSyncStatus('ok');
    } catch (e) {
      showToast(e.message, 'error');
      setSyncStatus('error');
    } finally { setDashLoading(false); }
  }

  useEffect(() => { loadAll(); }, []);

  const tabs = [
    { id: 'dashboard', label: 'Dashboard', icon: Icons.dashboard },
    { id: 'input', label: 'Input', icon: Icons.input },
    { id: 'settings', label: 'Settings', icon: Icons.settings },
  ];

  return (
    <>
      <div className="header">
        <div className="header-logo">fin<span>.</span>tracker</div>
        <div className="header-actions">
          <div className={'sync-dot ' + (syncStatus === 'ok' ? 'ok' : syncStatus === 'error' ? 'err' : '')} title={syncStatus} />
          <button className="icon-btn" onClick={loadAll} title="Refresh">{Icons.refresh}</button>
        </div>
      </div>

      {tab === 'dashboard' && <DashboardTab data={dashData} loading={dashLoading} currency={localCurrency} />}
      {tab === 'input' && <InputTab accounts={accounts} currency={localCurrency} onToast={showToast} />}
      {tab === 'settings' && <SettingsTab accounts={accounts} setAccounts={setAccounts} localCurrency={localCurrency} setLocalCurrency={setLocalCurrency} onToast={showToast} installPrompt={installPrompt} />}

      <div className="tab-bar">
        {tabs.map(t => (
          <button key={t.id} className={'tab-item ' + (tab === t.id ? 'active' : '')} onClick={() => setTab(t.id)}>
            {t.icon}
            <span className="tab-label">{t.label}</span>
          </button>
        ))}
      </div>

      {toast && <div className={'toast ' + toast.type}>{toast.msg}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

<script>
// Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}

// Generate apple-touch-icon dynamically
(function() {
  try {
    var s = 180;
    var c = document.createElement('canvas');
    c.width = s; c.height = s;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, s, s);
    g.addColorStop(0, '#5B73F7');
    g.addColorStop(1, '#3651D4');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 94px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('F', s / 2, s * 0.47);
    var link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  } catch(e) {}
})();
</script>
</body>
